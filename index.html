<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the iPhone notch area paint our dark
         background instead of leaving white bars. user-scalable=no avoids
         accidental pinch-zoom when swiping the page-stack horizontally. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Ctrl-Project</title>
    <!-- Theme color matches the app background so the iPhone status-bar
         tint blends cleanly when running as a home-screen app. -->
    <meta name="theme-color" content="#1c1b19" />
    <!-- iOS PWA meta: "Add to Home Screen" → opens full-screen without the Safari chrome.
         status-bar-style is "black", NOT "black-translucent". With black-translucent, iOS
         reported safe-area-inset-top: 59px (so the page believed it was painting behind the
         status bar) while sizing the web view to only screen.height - 59 = 873 of the 932pt
         screen AND top-aligning it — leaving a 59pt dead band below the web view that made the
         bottom bar look like it was floating up off the screen edge. Measured on device:
         screen 932, innerHeight 873, shell 0→873, bar flush at 873, gap 0. "black" lays the web
         view out below an opaque status bar so it reaches the bottom edge, and the top inset
         becomes 0 (the shell's env() padding then correctly collapses). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Ctrl-Project" />
    <!-- iOS renders apple-touch-icon at 180 and applies its own rounded-rect
         mask (no meaningful crop), so this one is full-bleed artwork. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/todo-app/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/todo-app/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/todo-app/icons/favicon-16.png" />
    <link rel="icon" href="/todo-app/favicon.ico" sizes="any" />
    <link rel="manifest" href="/todo-app/manifest.webmanifest" />
    <!-- The launch mark. It is 177 KB and nothing requests it until React first
         renders SplashScreen, so on a cold phone load the splash paints black and
         the mark pops in a beat later. Starting the fetch in <head> puts it in
         cache before the fade begins. The href uses the BASE_URL placeholder
         rather than a hard-coded '/todo-app/' like the icon links above, so it
         resolves to the same url main.tsx builds from import.meta.env.BASE_URL
         and the preload is actually the file the splash then requests. (Don't
         write the placeholder in this comment: Vite substitutes the token
         across the whole file, comments included.) -->
    <link rel="preload" as="image" href="%BASE_URL%icons/icon-512.png" />
  </head>
  <!-- Starts on the black launch ground, not the themed one: the stylesheet is
       render-blocking, so putting the class here means the FIRST painted frame
       already matches the splash instead of flashing #1c1b19 while the module
       script boots. main.tsx re-adds it (harmlessly) and SplashGate removes it. -->
  <body class="booting">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
